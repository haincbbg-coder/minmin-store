description: Cổng cho ChatGPT, Claude và AI khác làm việc cùng MinMin qua connector MCP có OAuth. AI đó đọc hội thoại và nhắn vào khung chat như bạn gõ. Bấm Mở trang để lấy địa chỉ, chọn mức quyền, ngắt kết nối.
author: MinMin
enabled: true
