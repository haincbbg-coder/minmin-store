# Gói "MinMin Gate": cổng cho ChatGPT, Claude và AI khác làm việc cùng MinMin.
#
# Tiền thân là "MinMin trong ChatGPT" (mã cũ minmin.minmin-trong-chatgpt, plugin minmin-trong-chatgpt).
# 2.0.0 đổi mã sang tiếng Anh, thêm Claude, và cho AI bên ngoài nhắn thẳng vào hội thoại của MinMin
# (MinMin 0.440.0) thay vì giao việc qua Kanban. `replaces` báo cho MinMin biết đây là bản cập nhật của
# gói cũ: cài lên là token, mức quyền và địa chỉ đã dán vào ChatGPT được giữ nguyên.
format: minmin-pack
spec: 1

id: minmin.gate
version: 2.1.0
replaces:
  - minmin.minmin-trong-chatgpt

name:
  vi: MinMin Gate
  en: MinMin Gate
description:
  vi: Cổng cho ChatGPT, Claude và AI khác làm việc cùng MinMin. AI đó đọc hội thoại của MinMin, tư vấn cho bạn, và khi bạn đồng ý thì nhắn thẳng vào khung chat để MinMin làm tiếp. Bạn xem được tiến độ, MinMin nhớ lại cho lần sau. Cần MinMin 0.440.0 trở lên, mật khẩu quản trị và tên miền https.
  en: A gate for ChatGPT, Claude and other AIs to work with MinMin. The AI reads your MinMin chats, advises you, and once you agree posts straight into the chat so MinMin carries on. You watch the progress, MinMin remembers it next time. Needs MinMin 0.440.0 or newer, an admin password and an https domain.

author:
  name: MinMin
license: MIT
homepage: https://github.com/haincbbg-coder/minmin-store/tree/main/packs/minmin.gate

# 0.440.0 mở bốn tool chat cho cửa Gate (`mcp_hub.tra_loi_jsonrpc(gate=...)`) và cơ chế đổi mã gói
# (`replaces`). Bản cũ hơn thì gói bị tắt kèm lý do đọc được.
compat:
  app: ">=0.440.0"

provides:
  plugins:
    - plugins/minmin-gate
